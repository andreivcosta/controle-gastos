<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Gastos</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 0 15px; }
        form { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 25px; }
        input, button { padding: 8px; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border-bottom: 1px solid #ccc; padding: 8px; text-align: left; }
    </style>
</head>
<script src="app.js" defer></script>
<body>

<h1>Controle de Gastos</h1>

<form id="form-gasto">
    <input type="text" id="descricao" placeholder="Descrição" required>
    <input type="number" id="valor" placeholder="Valor" step="0.01" required>
    <input type="date" id="data" required>
    <input type="text" id="categoria" placeholder="Categoria" required>
    <button type="submit">Adicionar</button>
</form>

<table>
    <thead>
    <tr>
        <th>Descrição</th>
        <th>Valor (R$)</th>
        <th>Data</th>
        <th>Categoria</th>
    </tr>
    </thead>
    <tbody id="lista-gastos">
    </tbody>
</table>

</body>
</html>
